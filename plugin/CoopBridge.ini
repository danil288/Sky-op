; Положите этот файл в Data\SKSE\Plugins рядом с CoopBridge.dll.
; Без файла плагин подключается к 127.0.0.1:7777 и использует значения по умолчанию.
[Server]
Host=127.0.0.1
Port=7777

; Нагрузка на игру при слежении за всеми загруженными NPC.
; Если игра подтормаживает, уменьшите MaxActors или BudgetMs, либо увеличьте FastMs и SlowMs.
[World]
MaxActors=300
BudgetMs=2
FastMs=250
SlowMs=1000
